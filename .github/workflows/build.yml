name: Build .deb

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Theos and SDKs
        run: |
          brew install ldid dpkg make
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          rm -rf "$HOME/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"

      - name: Build
        run: |
          export THEOS="$HOME/theos"
          export PATH="$(brew --prefix)/opt/make/libexec/gnubin:$PATH"
          xcodebuild -version
          set -o pipefail
          if ! make package FINALPACKAGE=1 2>&1 | tee build.log; then
            msg=$(grep -v '^$' build.log | tail -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: HideMyVPN-deb
          path: packages/*.deb

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --title "HideMyVPN $VERSION" --notes "Rootless build for Dopamine."
          gh release upload "v$VERSION" packages/*.deb --clobber
